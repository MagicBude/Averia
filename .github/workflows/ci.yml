name: Averia 持续集成

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: 数据与测试检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      - name: 运行数据校验与测试
        run: pnpm check

      - name: 验证导出流程
        run: pnpm data:export
